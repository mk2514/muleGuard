version: '3.8'

services:
  # -------------------------------------------------------------
  # Neo4j Graph Database
  # -------------------------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: muleguard-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # -------------------------------------------------------------
  # Backend API (FastAPI)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: muleguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_PATH=/data/muleguard.db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    volumes:
      - backend_data:/data
    depends_on:
      - neo4j

  # -------------------------------------------------------------
  # Frontend Web App (Nginx + React/Vite)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: muleguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
  backend_data:
