services:
  # -------------------------------------------------------------
  # MuleGuard AI - Backend Web Service (FastAPI + Docker)
  # -------------------------------------------------------------
  - type: web
    name: muleguard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_PATH
        value: /data/muleguard.db
      - key: FRONTEND_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
    disk:
      name: muleguard-storage
      mountPath: /data
      sizeGB: 1
